<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="keywords" content="social network, parable, community" />
		<meta name="description" content="community's parables, fun" />

		<link href="../css/parables_main.css" rel="stylesheet" />
		<link href="../css/table.css" rel="stylesheet" />
		<link
			href="https://fonts.googleapis.com/css2?family=Jacquarda+Bastarda+9&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>

		<title>притчи сообщества</title>
	</head>
	<body class="page">
		<div class="page__top">
			<div class="page__left-advert">Рекламный баннер левый</div>

			<div class="page__container" id="parent">
				<header class="page__header" id="header">
					<div class="header__title">
						<img
							class="title__ikon"
							src="../static/main-ikon.png"
						/>
						<article class="title__name">Название сайта</article>
					</div>
					<div class="header__menu">
						<div class="menu__item">
							<a
								href="parables_main.html"
								class="menu__link"
								id="menu_parables_main"
								>Главная страница</a
							>
						</div>
						<div class="menu__item">
							<a
								href="community_parables.html"
								class="menu__link"
								id="menu_community_parables"
								>Притчи сообщества</a
							>
						</div>
						<div class="menu__item">
							<a
								href="your_page.html"
								class="menu__link"
								id="menu_your_page"
								>Ваша страница</a
							>
						</div>
					</div>
				</header>

				<main>
					<h1 class="heading">Притчи</h1>

					<div class="add-parable">
						<form class="add-parable__form" id="parable-form">
							<div class="form-group">
								<label for="titleP">Title:</label>
								<input
									type="text"
									name="titleP"
									id="titleP"
									placeholder="Enter parable's title"
								/>
							</div>
							<div class="form-group">
								<label for="email">Email:</label>
								<input
									type="text"
									name="email"
									id="email"
									placeholder="Enter your email address"
								/>
							</div>
							<div class="form-group">
								<label for="parable">Your parable:</label>
								<input
									type="text"
									name="parable-text"
									id="parable"
									placeholder="Enter your parable"
								/>
							</div>
							<div class="parable-form_buttons">
								<button
									type="submit"
									class="btn btn-primary"
									id="submit-button"
								>
									Submit Parable
								</button>
								<button
									type="button"
									class="btn btn-primary"
									id="load-button"
								>
									Load Parables
								</button>
								<button
									class="btn btn-primary"
									id="clear-local-storage-btn"
								>
									Clear Local Storage
								</button>
							</div>
						</form>
					</div>

					<div class="parables-container">
						<div
							id="toast-container"
							class="fixed top-20 right-0 p-4 space-y-2 z-50"
						></div>
					</div>

					<!-- <div class="preloader preloader-animation"></div> -->
				</main>
			</div>

			<div class="page__right-advert">Рекламный баннер правый</div>
		</div>

		<footer class="footer">
			<p class="footer__text">&copy; 2024 Parables</p>
			<p class="footer__load-time" id="load-time"></p>
		</footer>

		<script src="../js/time-load.js"></script>
		<script src="../js/header-width-control.js"></script>
		<script src="../js/change-page.js"></script>
		<script src="../js/form-parable.js"></script>
	</body>
</html>
